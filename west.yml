# West manifest file for Simplicity SDK for Zephyr.
#
# The west workspace configuration file, .west/config, sets the
# path to the project containing this file in the [manifest] section's
# "path" variable.
#
# You are free to create your own manifest files and put them in any
# repository you want, to create your own custom workspaces.
# For example, you could create a manifest file in your own application
# directory, which would pull this repository in as an ordinary project.
#
# You can pass your manifest repository to west init when creating a
# new workspace. See the west documentation for more information.

manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: silabs
      url-base: https://github.com/siliconlabssoftware
    - name: asmellby
      url-base: https://github.com/asmellby
    - name: mitoryu
      url-base: https://github.com/mitoryu-silabs

  projects:
    - name: zephyr
      remote: mitoryu
      revision: 388a3b4541afd8c918b5cfa6a41fa56c5257dcfa
      import:
        # Simplicity SDK for Zephyr imports the Zephyr main tree at the
        # revision given above. Only the modules named below are imported.
        # If a module is overridden it is not listed here, and instead
        # added separately at the top level.
        name-allowlist:
          - cmsis-dsp
          - cmsis-nn
          - cmsis_6
          - fatfs
          - littlefs
          - lvgl
          - mbedtls
          - mldsa-native
          - picolibc
          - segger
          - zcbor
    - name: hal_silabs
      remote: silabs
      revision: 507ef981a843bc8f38e2f5c4b80dce3766401429
      path: modules/hal/silabs
    - name: openthread
      remote: asmellby
      repo-path: zephyr-openthread
      revision: 788b21174826222c62b5cbbf1027a5eb92ee5ffb
      path: modules/lib/openthread
    - name: mcuboot
      remote: silabs
      repo-path: zephyr-mcuboot
      revision: 38959e68d47c186bbdca71fec48a45297054ff38
      path: bootloader/mcuboot
    - name: tf-psa-crypto
      remote: silabs
      repo-path: zephyr-tf-psa-crypto
      revision: 98c6e5b2c40336b5ac840efd42822f82bccfa7ba
      path: modules/crypto/tf-psa-crypto
    - name: zephyr-hal-silabs-extra
      remote: asmellby
      revision: ce40265406d7562d05afaed6fa828f6d63cb9444
      path: modules/hal/silabs_extra
